# Configuración del bot de noticias DEITEL
# Horas en zona America/Santiago. Un post por país por día.

timezone: America/Santiago
window_hours: 36          # solo noticias publicadas en las últimas N horas
max_candidates: 25        # candidatos por país que se le muestran al modelo
model: claude-sonnet-4-5  # modelo de Anthropic para seleccionar y redactar

# Lista blanca de medios: si un país tiene al menos min_preferred candidatos de
# medios de referencia, al modelo SOLO se le muestran esos. Si hay menos, se muestran
# todos, pero los de referencia van primero y marcados con ★.
min_preferred: 3
preferred_sources_global:
  - Reuters
  - Bloomberg
  - EFE
  - AFP
  - BNamericas
  - TeleSemana
  - DPL News
  - Forbes
  - Infobae

# Cuentas de Postiz donde publicar (se buscan por plataforma + nombre)
channels:
  - platform: linkedin-page
    name: Grupodeitel
  - platform: instagram
    name: Deitel SPA
  - platform: linkedin
    name: Marcelo Pool Skiadaressis

countries:
