  - {when: "09-19", name: "Día de las Glorias del Ejército", scope: "Chile"}
  - {when: "10-12", name: "Día del Encuentro de Dos Mundos / Dia de Nossa Senhora Aparecida (Brasil)", scope: "todos"}
  - {when: "10-3sun", name: "Día de la Madre en Argentina", scope: "Argentina"}
