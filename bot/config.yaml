# Hashtags fijos por idioma (el modelo puede agregar 2-3 más)
hashtags:
  es: "#Telecomunicaciones #Infraestructura #TorresDeTelecomunicaciones #DEITEL"
  pt: "#Telecomunicações #Infraestrutura #TorresDeTelecom #DEITEL"

# ---------------------------------------------------------------------------
# Campaña: mientras la fecha de hoy esté entre start y end, el bot NO publica las
# noticias por país ni el post del día: publica solo los posts de la campaña cuya
# fecha sea hoy (textos fijos, no usa Claude). Cada post genera una tarjeta en
# español (cuentas lang es) y otra en portugués (cuentas lang pt).
campaign:
  enabled: true
  name: Futurecom 2026
  start: "2026-10-03"
  end: "2026-10-08"
  category: FUTURECOM 2026
  # franja naranja de la tarjeta ilustrada
  info: {es: "6–8 OCT 2026 · SÃO PAULO EXPO · STAND I023", pt: "6–8 OUT 2026 · SÃO PAULO EXPO · ESTANDE I023"}
  badge: {es: "Expositor", pt: "Expositor"}
  # logo oficial del evento (archivo entregado por el organizador); si no existe, no se pone
  event_logo: bot/futurecom_logo.png
  hashtags:
    es: "#Futurecom2026 #Futurecom #Telecomunicaciones #TorresDeTelecomunicaciones #DEITEL"
    pt: "#Futurecom2026 #Futurecom #Telecomunicações #TorresDeTelecom #DEITEL"
  posts:
    - id: FC1
      date: "2026-10-03"
      time: "17:00"
      es:
        title: "DEITEL estará en Futurecom 2026"
        summary: "Del 6 al 8 de octubre en el São Paulo Expo, Brasil. Te esperamos en el stand I023."
        text: |-
          📡 DEITEL estará en Futurecom 2026.

          Del 6 al 8 de octubre participaremos en una de las principales ferias de telecomunicaciones y tecnología de América Latina, en el São Paulo Expo (Brasil).

          En nuestro stand I023 presentaremos nuestra experiencia en torres autoportantes y estructuras metálicas para telecomunicaciones, junto a los equipos de DEITEL Chile y DEITEL Brasil.

          ¿Vas a Futurecom? Escríbenos y agendemos una reunión en el stand.

          🌐 deitel.cl · deitel.com.br
      pt:
        title: "A DEITEL estará na Futurecom 2026"
        summary: "De 6 a 8 de outubro no São Paulo Expo. Esperamos você no estande I023."
        text: |-
          📡 A DEITEL estará na Futurecom 2026.

          De 6 a 8 de outubro participaremos de uma das principais feiras de telecomunicações e tecnologia da América Latina, no São Paulo Expo.

          No nosso estande I023 vamos apresentar nossa experiência em torres autoportantes e estruturas metálicas para telecomunicações, com as equipes da DEITEL Brasil e da DEITEL Chile.

          Vai à Futurecom? Fale com a gente e agende uma reunião no estande.

          🌐 deitel.com.br · deitel.cl
    - id: FC2
      date: "2026-10-04"
      time: "10:00"
      art: booth          # ilustración del stand en vez de la torre
      es:
        title: "Un stand hecho de acero, como nuestras torres"
        summary: "Estructura metálica desmontable y apernada. Al terminar la feria, el material vuelve a producción: cero residuos."
        text: |-
          🏗️ Para Futurecom 2026 diseñamos un stand a la altura de lo que hacemos: una estructura de acero desmontable, unida con pernos, que sigue la misma lógica constructiva de nuestras torres.

          Cero residuos: al terminar la feria, todo el material vuelve a nuestra línea de producción.

          Ven a verlo del 6 al 8 de octubre en el stand I023 del São Paulo Expo.
      pt:
        title: "Um estande feito de aço, como as nossas torres"
        summary: "Estrutura metálica desmontável e parafusada. Depois da feira, o material volta para a produção: resíduo zero."
        text: |-
          🏗️ Para a Futurecom 2026 projetamos um estande à altura do que fazemos: uma estrutura de aço desmontável, parafusada, que segue a mesma lógica construtiva das nossas torres.

